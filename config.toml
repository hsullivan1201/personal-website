# The URL the site will be built for
base_url = "https://lostinthehaze.net"
title="lost in the haze"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

[markdown]
# Syntax highlighting is off unless a [markdown.highlighting] table is added
# (Zola 0.22+; see https://www.getzola.org/documentation/content/syntax-highlighting/)

[extra]
# Put all your custom variables here
generate_feed = true
