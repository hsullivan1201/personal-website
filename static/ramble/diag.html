<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ramble diag</title>
<meta name="robots" content="noindex, nofollow">
<style>
body { background:#1c1b1a; color:#e6e1dc; font-family: "courier new", monospace;
       font-size: 0.85rem; padding: 1rem; line-height: 1.5; word-break: break-all; }
.ok { color: #7fbf7f; } .bad { color: #e06c6c; }
</style>
</head>
<body>
<div id="out">running probes…</div>
<script>
const API = "https://ramble-api.lostinthehaze.net";
const OLD = "https://ramble-worker.lostinthehaze.workers.dev";
const out = document.getElementById("out");
const line = (label, ok, detail) => {
  const d = document.createElement("div");
  d.className = ok ? "ok" : "bad";
  d.textContent = `${ok ? "✓" : "✗"} ${label}: ${detail}`;
  out.appendChild(d);
};

(async () => {
  out.textContent = "";
  const info = document.createElement("div");
  info.textContent = "UA: " + navigator.userAgent;
  out.appendChild(info);

  // 1. same-origin control
  try {
    const r = await fetch("./manifest.webmanifest");
    line("same-origin GET", r.ok, "status " + r.status);
  } catch (e) { line("same-origin GET", false, e.name + " " + e.message); }

  // 2. app.js freshness (which worker URL does the cached page code use?)
  try {
    const t = await (await fetch("./app.js")).text();
    const m = t.match(/https:\/\/ramble[^"]+/);
    line("app.js version", !!m && m[0].includes("ramble-api"), m ? m[0] : "no url found");
  } catch (e) { line("app.js version", false, e.name + " " + e.message); }

  // 3. simple cross-origin GET to the API (no preflight)
  try {
    const r = await fetch(API + "/health");
    line("API GET /health", r.ok, "status " + r.status + " " + await r.text());
  } catch (e) { line("API GET /health", false, e.name + " " + e.message); }

  // 4. preflighted POST to the API (exactly what the setup flow does)
  try {
    const r = await fetch(API + "/auth/options", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: "{}",
    });
    line("API POST /auth/options", true, "status " + r.status + " " + await r.text());
  } catch (e) { line("API POST /auth/options", false, e.name + " " + e.message); }

  // 5. old workers.dev host for comparison (may 404/error once retired — that's fine,
  //    what matters is whether the connection itself succeeds)
  try {
    const r = await fetch(OLD + "/health");
    line("old workers.dev GET", true, "status " + r.status);
  } catch (e) { line("old workers.dev GET", false, e.name + " " + e.message); }

  // 6. webauthn availability
  line("webauthn", !!window.PublicKeyCredential, window.PublicKeyCredential ? "available" : "missing");

  const done = document.createElement("div");
  done.textContent = "— done. screenshot this. —";
  out.appendChild(done);
})();
</script>
</body>
</html>
