<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>aqua line</title>
<meta name="description" content="A flooded, slightly wrong DC Metro: fountains in the trackbed, waterfalls on the escalators, an arrival board that rises out of a reflecting pool.">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛲</text></svg>">
</head>
<body>
<h1 class="sr">aqua line — a flooded dc metro</h1>

<div id="wrap">
  <div id="stage">
    <canvas id="view" role="img" aria-label="An illustrated, flooded DC Metro station. Move the pointer around; things respond."></canvas>
    <a class="home" href="/">&larr; lost in the haze</a>
    <button id="mute" class="hud" type="button" aria-pressed="true">sound: on</button>
    <button id="access" type="button" tabindex="-1">tap in</button>
    <div id="caption" aria-live="polite"></div>

    <div id="loader">
      <div class="ld-inner">
        <div class="ld-roundel"><span>M</span></div>
        <p class="ld-title">aqua line</p>
        <p class="ld-sub">fountain service &middot; all stations</p>
        <div class="ld-track"><div id="load-bar"></div></div>
        <p class="ld-msg">flooding stations&hellip;</p>
        <div class="ld-go">
          <button id="enter" type="button">enter</button>
          <button id="enter-quiet" type="button">enter without sound</button>
        </div>
        <p class="ld-fine">best experienced with sound &middot; move the pointer around &middot; things respond</p>
      </div>
    </div>
  </div>
  <nav id="strip" aria-label="stations on the aqua line"></nav>
</div>

<nav class="sr" aria-label="site">
  <a href="/">home</a>
  <a href="/pages/about/">about</a>
  <a href="/pages/now/">now</a>
  <a href="/horloge/">horloge</a>
  <a href="/sparrows/">sparrows</a>
</nav>
<noscript><p class="nojs">the aqua line runs on javascript. <a href="/">back to lost in the haze</a></p></noscript>

<script src="engine.js"></script>
<script src="audio.js"></script>
<script src="s1-foggy.js"></script>
<script src="s2-waterfront.js"></script>
<script src="s3-metrocenter.js"></script>
<script src="s4-potomac.js"></script>
<script src="s5-tidalbasin.js"></script>
<script src="app.js"></script>
</body>
</html>
