name: build zola
on:
  push:
    branches: [ main ] # or master
# the deploy step pushes to gh-pages; nothing else needs the token
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # pinned to commit SHAs so a moved tag can't swap in different code
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build and deploy
        uses: shalzz/zola-deploy-action@1be083648a1db2853ce4970e381740c0e2fd06de # v0.23.6
        env:
          PAGES_BRANCH: gh-pages
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # if you have a custom domain, zola needs to know to put the CNAME file in public/
          # but the github pages settings (step 4) usually handles creation of the CNAME file for you.
          # just make sure your config.toml base_url matches the final domain.
